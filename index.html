<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Kamal Kunj Expense Tracker</title>
  <meta name="description" content="Track and update Kamal Kunj construction expenses from any device." />

  <!-- Fonts (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Chart.js (optional; app degrades gracefully if it fails to load) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M4 20V8l8-5 8 5v12"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <span class="brand-name">Kamal Kunj</span>
      </div>
      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="#/dashboard" data-route="dashboard"></a>
        <a class="nav-link" href="#/expenses" data-route="expenses"></a>
        <a class="nav-link" href="#/vendors" data-route="vendors"></a>
        <a class="nav-link" href="#/reports" data-route="reports"></a>
        <a class="nav-link" href="#/settings" data-route="settings"></a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted small">Stored on Netlify · email on each expense</span>
      </div>
    </aside>

    <!-- Backdrop for mobile sidebar -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main column -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
          <button class="btn primary" id="add-expense-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="btn-label">Add Expense</span>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="tabbar" aria-label="Primary mobile">
      <a class="tab" href="#/dashboard" data-route="dashboard"></a>
      <a class="tab" href="#/expenses" data-route="expenses"></a>
      <a class="tab" href="#/vendors" data-route="vendors"></a>
      <a class="tab" href="#/reports" data-route="reports"></a>
      <a class="tab" href="#/settings" data-route="settings"></a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
